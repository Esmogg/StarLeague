services:
  web:
    build: .
    ports:
      - "${WEB_PORT:-80}:80"
    environment:
      DB_HOST: db
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASS: ${DB_PASS}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASS}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASS}
      TZ: America/Montevideo
    volumes:
      - dbdata:/var/lib/mysql
      # Se ejecutan en orden y SOLO la primera vez (cuando el volumen está vacío)
      - ./database/starleague_BD.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ./database/starleague_seed.sql:/docker-entrypoint-initdb.d/02_seed.sql:ro
      # Quita privilegios sobrantes al usuario de la app (DCL, criterio 2 y 3)
      - ./database/03_dcl_docker.sh:/docker-entrypoint-initdb.d/03_dcl.sh:ro
    # Sin "ports": la base queda solo en la red interna de Docker
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASS}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    restart: unless-stopped

volumes:
  dbdata:
