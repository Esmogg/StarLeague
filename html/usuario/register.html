<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Starleague - Registro</title>

    <link rel="icon" type="image/png" href="../../images/logo.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Outfit:wght@100..900&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="../../css/style.css" />
    <link rel="stylesheet" href="../../css/usuario/login-register.css" />

    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
    />
  </head>

  <body>
    <div class="contenedor">
      <header>
        <a href="../../index.html">
          <img src="../../images/logo.png" alt="Logo Starleague" class="logo" />
        </a>

        <div class="title">☆ Registro ☆</div>
      </header>

      <div class="contenido">
        <div id="menuOverlay"></div>

        <main>
          <div class="registro-body">
            <div class="registro-mascota">
              <div class="registro-globo">
                <img
                  src="../../images/mascota/globo.png"
                  alt="Globo de texto"
                  class="globo-img"
                />

                <p class="globo-texto">¡Bienvenido!</p>
              </div>

              <img
                src="../../images/mascota/mascota-registro.png"
                alt="Mascota Starleague"
                class="mascota-registro"
              />
            </div>

            <form
              action="../../php/register.php"
              method="post"
              class="registro-form"
            >
              <fieldset class="seccionFormulario">
                <div class="campoFormulario">
                  <label for="new_user">Nombre de Usuario</label>
                  <input type="text" name="new_user" id="new_user" />
                </div>

                <div class="campoFormulario">
                  <label for="mail">Correo Electronico</label>
                  <input type="email" name="mail" id="mail" />
                </div>

                <div class="campoFormulario">
                  <label for="new_pass">Contraseña</label>
                  <input type="password" name="new_pass" id="new_pass" />
                </div>

                <div class="campoFormulario">
                  <label for="new_pass2">Repetir Contraseña</label>
                  <input type="password" name="new_pass2" id="new_pass2" />
                </div>
              </fieldset>

              <div class="accionesFormulario registro-acciones">
                <input type="submit" value="Registrarse" class="btn-registro" />

                <a href="../../index.html" class="btn-regresar">
                  Regresar
                  <i class="fa-solid fa-right-to-bracket"></i>
                </a>
              </div>

              <p class="registro-login">
                ¿Ya tienes una cuenta?
                <a href="../usuario/login.html">Inicia sesión!</a>
              </p>
            </form>
          </div>
        </main>
      </div>
    </div>

    <button id="btnSubir">
      <i class="fa-solid fa-chevron-up"></i>
    </button>

    <script src="../../js/script.js" defer></script>
  </body>
</html>
