<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Starleague</title>

    <link rel="icon" type="image/png" href="../../images/logo.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Outfit:wght@100..900&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="../../css/style.css" />
    <link rel="stylesheet" href="../../css/usuario/login.css" />
    
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
    />
  </head>

  <body>
    <div class="contenedor login-page">
      <header>
        <a href="../../index.html">
          <img src="../../images/logo.png" alt="Logo Starleague" class="logo" />
        </a>

        <div class="title">☆ Iniciar sesión ☆</div>
      </header>
      <div class="contenido">
        <div id="menuOverlay"></div>
        <main>
          <div class="login-body">
            <div class="login-mascota">
              <div class="login-globo">
                <img
                  src="../../images/mascota/globo.png"
                  alt="Globo de texto"
                  class="globo-img"
                />
                <p class="globo-texto">¡Bienvenido!</p>
              </div>

              <img
                src="../../images/mascota/mascota-login.png"
                alt="Mascota Starleague"
                class="mascota-login"
              />
            </div>

            <form action="../../php/login.php" method="post" class="login-form">
              <fieldset class="seccionFormulario">
                <div class="campoFormulario">
                  <label for="user">Nombre de Usuario</label>
                  <input type="text" name="user" id="user" />
                </div>

                <div class="campoFormulario">
                  <label for="mail">Correo Electronico</label>
                  <input type="email" name="mail" id="mail" />
                </div>

                <div class="campoFormulario">
                  <label for="pass">Contraseña</label>
                  <input type="password" name="pass" id="pass" />
                </div>
              </fieldset>

              <div class="accionesFormulario login-acciones">
                <input type="submit" value="Login" class="btn-login" />

                <a href="../../index.html" class="btn-regresar">
                  Regresar <i class="fa-solid fa-right-to-bracket"></i>
                </a>
              </div>

              <p class="login-registro">
                ¿No tienes una cuenta? 
                <a href="../usuario/register.html">Regístrate!</a>
              </p>
            </form>
          </div>
        </main>
      </div>
    </div>

    <button id="btnSubir">
      <i class="fa-solid fa-chevron-up"></i>
    </button>

    <script src="../../js/script.js" defer></script>
  </body>
</html>
