<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Starleague - Registro</title>

    <link rel="icon" type="image/png" href="../../../images/logo.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Outfit:wght@100..900&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="../../../css/style.css" />
    <link rel="stylesheet" href="../../../css/usuario/login-register.css" />

    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
      integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
  </head>

  <body>
    <div class="contenedor">
      <header>
        <a href="../../../index.html">
          <img
            src="../../../images/logo.png"
            alt="Logo Starleague"
            class="logo"
          />
        </a>

        <div class="title">☆ Registro ☆</div>

        <button
          id="themeToggleButton"
          class="theme-toggle"
          type="button"
          aria-label="Activar modo oscuro"
          aria-pressed="false"
          title="Activar modo oscuro"
        >
          <i class="fa-solid fa-moon" aria-hidden="true"></i>
        </button>
      </header>

      <div class="contenido">
        <div id="menuOverlay"></div>

        <main>
          <div class="registro-body">
            <div class="registro-mascota">
              <div class="registro-globo">
                <img
                  src="../../../images/mascota/globo.png"
                  alt="Globo de texto"
                  class="globo-img"
                />

                <p class="globo-texto">¡Bienvenido!</p>
              </div>

              <img
                src="../../../images/mascota/mascota-registro.png"
                alt="Mascota Starleague"
                class="mascota-registro"
              />
            </div>

            <form id="formRegistro" class="registro-form" method="post">
              <fieldset class="seccionFormulario">
                <div class="campoFormulario">
                  <label for="new_user">Nombre de Usuario</label>
                  <input
                    type="text"
                    name="new_user"
                    id="new_user"
                    maxlength="30"
                    autocomplete="username"
                  />
                </div>

                <div class="campoFormulario">
                  <label for="mail">Correo Electronico</label>
                  <input
                    type="email"
                    name="mail"
                    id="mail"
                    maxlength="150"
                    autocomplete="email"
                  />
                </div>

                <div class="campoFormulario">
                  <label for="new_pass">Contraseña</label>
                  <input
                    type="password"
                    name="new_pass"
                    id="new_pass"
                    maxlength="72"
                    autocomplete="new-password"
                  />
                </div>

                <div class="campoFormulario">
                  <label for="new_pass2">Repetir Contraseña</label>
                  <input
                    type="password"
                    name="new_pass2"
                    id="new_pass2"
                    maxlength="72"
                    autocomplete="new-password"
                  />
                </div>
              </fieldset>

              <div class="accionesFormulario registro-acciones">
                <input type="submit" value="Registrarse" class="btn-registro" />

                <a href="../../../index.html" class="btn-regresar">
                  Regresar
                  <i class="fa-solid fa-right-to-bracket"></i>
                </a>
              </div>

              <p id="mensaje" class="mensaje"></p>

              <p class="registro-login">
                ¿Ya tienes una cuenta?
                <a href="../usuario/login.html">Inicia sesión!</a>
              </p>
            </form>
          </div>
        </main>
      </div>
    </div>

    <button id="btnSubir" aria-label="Volver al inicio">
      <i class="fa-solid fa-chevron-up" aria-hidden="true"></i>
    </button>

    <script src="../../../js/script.js" defer></script>
    <script src="../../../js/validaciones.js" defer></script>
    <script src="../../../js/usuario/register.js" defer></script>
  </body>
</html>
