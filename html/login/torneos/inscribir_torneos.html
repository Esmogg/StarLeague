        <div id="menuOverlay"></div>
        <main>
          <article>
            <!-- Agregamos el formulario que enviará los datos -->
            <!-- Dentro de inscribir_torneos.html -->
            <form action="../../../php/torneos/procesar_inscripcion.php" method="POST">
              <fieldset class="seccionFormulario" id="seccionInformacionGeneral">
                <legend>Información General</legend>
                <div class="camposFormulario" id="informacionGeneral">
                  <!-- 1. Seleccionar Torneo -->
                  <div class="campoFormulario">
                    <label for="id_torneo">Seleccionar torneo a inscribir:</label>
                    <select id="id_torneo" name="id_torneo" required>
                      <option value="">Cargando torneos...</option>
                    </select>
                  </div>

                  <!-- 2. Seleccionar Participante (se activa al elegir un torneo) -->
                  <div class="campoFormulario">
                    <label id="label_participante" for="id_participante"
                      >Seleccionar Participante:</label
                    >
                    <select
                      id="id_participante"
                      name="id_participante"
                      disabled
                      required
                    >
                      <option value="">Primero seleccione un torneo</option>
                    </select>
                  </div>
                </div>
              </fieldset>

                <!-- Campo oculto para avisar al backend si estamos inscribiendo un 'usuario' o 'equipo' -->
                <input
                  type="hidden"
                  id="tipo_inscripcion"
                  name="tipo_inscripcion"
                  value=""
                />

              <div class="accionesFormulario">
                <button type="submit" class="botonEnviar">
                  <i class="fa-solid fa-check"></i> Registrar Inscripción
                </button>
              </div>

            </form>
          </article>
