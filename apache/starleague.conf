# VirtualHost de StarLeague (AlmaLinux: /etc/httpd/conf.d/starleague.conf)
# Ajustar ServerName y DocumentRoot a la ruta real del proyecto.

<VirtualHost *:80>
    ServerName starleague.local
    DocumentRoot /var/www/starleague

    <Directory /var/www/starleague>
        # Permite que el .htaccess del proyecto aplique reglas y reescritura
        AllowOverride All
        Require all granted
    </Directory>

    # Credenciales de la BD fuera del código (alternativa a config.local.php)
    # SetEnv STARLEAGUE_DB_PASS "..."

    ErrorLog  /var/log/httpd/starleague_error.log
    CustomLog /var/log/httpd/starleague_access.log combined
</VirtualHost>

# Con HTTPS (recomendado en producción), redirigir y usar un bloque :443:
# <VirtualHost *:80>
#     ServerName starleague.local
#     Redirect permanent / https://starleague.local/
# </VirtualHost>
