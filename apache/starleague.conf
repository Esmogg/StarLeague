# VirtualHost de StarLeague: Apache (puerto 80) hace de proxy hacia el contenedor
# Docker, que solo escucha en 127.0.0.1:8080.
# Instalación en AlmaLinux: copiar a /etc/httpd/conf.d/starleague.conf
# Requiere:  sudo setsebool -P httpd_can_network_connect 1

<VirtualHost *:80>
    ServerName starleague.local

    ProxyPreserveHost On
    ProxyPass        / http://127.0.0.1:8080/
    ProxyPassReverse / http://127.0.0.1:8080/
    RequestHeader set X-Forwarded-Proto "http"

    ErrorLog  /var/log/httpd/starleague_error.log
    CustomLog /var/log/httpd/starleague_access.log combined
</VirtualHost>

# Con HTTPS (recomendado en producción), redirigir y usar un bloque :443:
# <VirtualHost *:80>
#     ServerName starleague.local
#     Redirect permanent / https://starleague.local/
# </VirtualHost>
